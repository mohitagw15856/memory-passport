<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150" role="img" aria-label="Excluded by default: card numbers, bank accounts, government IDs, secrets; health is opt-in">
  <style>
    .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: Menlo, Consolas, monospace; }
  </style>
  <rect width="1100" height="150" rx="20" fill="#0f172a"/>
  <text x="550" y="38" text-anchor="middle" class="t" font-size="18" font-weight="700" fill="#fca5a5">the validator refuses these, so a passport can never leak them</text>
  <g class="m" font-size="14" font-weight="700">
    <g transform="translate(40 65)"><rect width="190" height="46" rx="23" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="95" y="29" text-anchor="middle" fill="#fecaca">💳 card-number</text></g>
    <g transform="translate(250 65)"><rect width="190" height="46" rx="23" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="95" y="29" text-anchor="middle" fill="#fecaca">🏦 bank-account</text></g>
    <g transform="translate(460 65)"><rect width="200" height="46" rx="23" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="100" y="29" text-anchor="middle" fill="#fecaca">🪪 government-id</text></g>
    <g transform="translate(680 65)"><rect width="150" height="46" rx="23" fill="#450a0a" stroke="#f87171" stroke-width="2"/><text x="75" y="29" text-anchor="middle" fill="#fecaca">🔑 secret</text></g>
    <g transform="translate(850 65)"><rect width="210" height="46" rx="23" fill="#3b2a12" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/><text x="105" y="29" text-anchor="middle" fill="#fde68a">🩺 health (opt-in)</text></g>
  </g>
  <text x="550" y="135" text-anchor="middle" class="t" font-size="13" fill="#94a3b8">Luhn and IBAN check digits, ID patterns, key formats, and a health keyword list · allow_health: true in passport.yaml turns the last one on</text>
</svg>
