<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200" role="img" aria-label="The three provenance tags: stated, observed, inferred">
  <style>
    .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: Menlo, Consolas, monospace; }
  </style>
  <rect width="1100" height="200" rx="20" fill="#0f172a"/>
  <g transform="translate(30 30)">
    <rect width="330" height="140" rx="14" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
    <text x="24" y="42" class="m" font-size="24" font-weight="800" fill="#34d399">[stated]</text>
    <text x="24" y="74" class="t" font-size="15" fill="#d1fae5">You said it, in so many words.</text>
    <text x="24" y="98" class="t" font-size="14" fill="#6ee7b7">Trust: high. Treat as true until you say otherwise.</text>
    <text x="24" y="124" class="m" font-size="13" fill="#a7f3d0">"Works four days a week."</text>
  </g>
  <g transform="translate(385 30)">
    <rect width="330" height="140" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="24" y="42" class="m" font-size="24" font-weight="800" fill="#60a5fa">[observed]</text>
    <text x="24" y="74" class="t" font-size="15" fill="#dbeafe">The product saw it happen.</text>
    <text x="24" y="98" class="t" font-size="14" fill="#93c5fd">Trust: medium. True of the past; may have changed.</text>
    <text x="24" y="124" class="m" font-size="13" fill="#bfdbfe">"Most active 07:00–10:00 UK."</text>
  </g>
  <g transform="translate(740 30)">
    <rect width="330" height="140" rx="14" fill="#3b2a12" stroke="#fbbf24" stroke-width="2"/>
    <text x="24" y="42" class="m" font-size="24" font-weight="800" fill="#fbbf24">[inferred]</text>
    <text x="24" y="74" class="t" font-size="15" fill="#fef3c7">The product guessed.</text>
    <text x="24" y="98" class="t" font-size="14" fill="#fcd34d">Trust: low. Hedge, and prefer to confirm.</text>
    <text x="24" y="124" class="m" font-size="13" fill="#fde68a">"Probably has a data-science background."</text>
  </g>
</svg>
