<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Memory silos flow into one passport vault and back out to any product">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: Menlo, Consolas, monospace; }
  </style>
  <rect width="1100" height="360" rx="20" fill="#0f172a"/>
  <text x="550" y="40" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#e2e8f0">before: every product is a silo · after: one vault, many stamps</text>

  <!-- left silos -->
  <g class="t" font-size="15" font-weight="600">
    <g transform="translate(40 80)"><rect width="170" height="46" rx="10" fill="#134e4a" stroke="#34d399"/><text x="85" y="29" text-anchor="middle" fill="#a7f3d0">ChatGPT export.zip</text></g>
    <g transform="translate(40 140)"><rect width="170" height="46" rx="10" fill="#4a1d3a" stroke="#f472b6"/><text x="85" y="29" text-anchor="middle" fill="#fbcfe8">claude.ai memory</text></g>
    <g transform="translate(40 200)"><rect width="170" height="46" rx="10" fill="#3b2a12" stroke="#fbbf24"/><text x="85" y="29" text-anchor="middle" fill="#fde68a">Claude Code memory/</text></g>
    <g transform="translate(40 260)"><rect width="170" height="46" rx="10" fill="#1e293b" stroke="#94a3b8"/><text x="85" y="29" text-anchor="middle" fill="#e2e8f0">any markdown folder</text></g>
  </g>
  <!-- arrows in -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M212 103 C 300 103, 320 180, 395 180"/>
    <path d="M212 163 C 300 163, 320 180, 395 180"/>
    <path d="M212 223 C 300 223, 320 180, 395 180"/>
    <path d="M212 283 C 300 283, 320 180, 395 180"/>
  </g>
  <text x="300" y="70" text-anchor="middle" class="m" font-size="14" fill="#a5b4fc">passport import</text>

  <!-- vault -->
  <g transform="translate(400 90)">
    <rect width="300" height="180" rx="16" fill="url(#vault)"/>
    <text x="150" y="34" text-anchor="middle" class="t" font-size="18" font-weight="800" fill="#fff">passport vault</text>
    <g class="m" font-size="13" fill="#ede9fe">
      <text x="24" y="66">passport.yaml</text>
      <text x="24" y="86">profile.md</text>
      <text x="24" y="106">preferences.md</text>
      <text x="160" y="66">people/priya.md</text>
      <text x="160" y="86">topics/e-ink.md</text>
      <text x="160" y="106">areas/ledger.md</text>
    </g>
    <g class="m" font-size="12" font-weight="700">
      <rect x="24" y="128" width="72" height="24" rx="6" fill="#065f46"/><text x="60" y="145" text-anchor="middle" fill="#a7f3d0">[stated]</text>
      <rect x="104" y="128" width="88" height="24" rx="6" fill="#1e3a8a"/><text x="148" y="145" text-anchor="middle" fill="#bfdbfe">[observed]</text>
      <rect x="200" y="128" width="80" height="24" rx="6" fill="#78350f"/><text x="240" y="145" text-anchor="middle" fill="#fde68a">[inferred]</text>
    </g>
  </g>

  <!-- arrows out -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M705 180 C 780 180, 800 103, 885 103"/>
    <path d="M705 180 C 780 180, 800 163, 885 163"/>
    <path d="M705 180 C 780 180, 800 223, 885 223"/>
    <path d="M705 180 C 780 180, 800 283, 885 283"/>
  </g>
  <text x="800" y="70" text-anchor="middle" class="m" font-size="14" fill="#a5b4fc">passport export</text>
  <g class="t" font-size="15" font-weight="600">
    <g transform="translate(890 80)"><rect width="170" height="46" rx="10" fill="#134e4a" stroke="#34d399"/><text x="85" y="29" text-anchor="middle" fill="#a7f3d0">ChatGPT paste</text></g>
    <g transform="translate(890 140)"><rect width="170" height="46" rx="10" fill="#4a1d3a" stroke="#f472b6"/><text x="85" y="29" text-anchor="middle" fill="#fbcfe8">Claude import</text></g>
    <g transform="translate(890 200)"><rect width="170" height="46" rx="10" fill="#1e3a8a" stroke="#60a5fa"/><text x="85" y="29" text-anchor="middle" fill="#bfdbfe">Cursor .mdc rule</text></g>
    <g transform="translate(890 260)"><rect width="170" height="46" rx="10" fill="#3b2a12" stroke="#fbbf24"/><text x="85" y="29" text-anchor="middle" fill="#fde68a">Claude Code / Hermes</text></g>
  </g>
  <text x="550" y="335" text-anchor="middle" class="m" font-size="14" fill="#a5b4fc">validate · merge · diff — plain text, git-friendly, human-editable</text>
</svg>
