<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="memory-passport: one plain-text format for AI assistant memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#c4b5fd" opacity="0.5">
    <circle cx="90" cy="50" r="2"/><circle cx="1110" cy="70" r="2.5"/><circle cx="1000" cy="270" r="1.8"/>
    <circle cx="160" cy="280" r="1.5"/><circle cx="620" cy="40" r="1.5"/><circle cx="1150" cy="200" r="1.5"/>
  </g>
  <!-- passport booklet -->
  <g transform="translate(90 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="200" rx="14" fill="url(#book)"/>
    <rect x="12" y="12" width="126" height="176" rx="10" fill="none" stroke="#e9d5ff" stroke-width="2" opacity="0.7"/>
    <circle cx="75" cy="78" r="30" fill="none" stroke="#fde68a" stroke-width="3"/>
    <path d="M45 78h60M75 48v60M55 58q20 20 40 0M55 98q20-20 40 0" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round"/>
    <text x="75" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fde68a" letter-spacing="3">PASSPORT</text>
    <text x="75" y="160" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#e9d5ff" letter-spacing="2">MEMORY EDITION</text>
  </g>
  <!-- stamps -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="1">
    <g transform="translate(255 70) rotate(-12)">
      <rect x="0" y="0" width="118" height="44" rx="8" fill="none" stroke="#34d399" stroke-width="3"/>
      <text x="59" y="28" text-anchor="middle" fill="#34d399">CHATGPT ✓</text>
    </g>
    <g transform="translate(270 135) rotate(7)">
      <rect x="0" y="0" width="104" height="44" rx="8" fill="none" stroke="#f472b6" stroke-width="3"/>
      <text x="52" y="28" text-anchor="middle" fill="#f472b6">CLAUDE ✓</text>
    </g>
    <g transform="translate(250 205) rotate(-5)">
      <rect x="0" y="0" width="104" height="44" rx="8" fill="none" stroke="#60a5fa" stroke-width="3"/>
      <text x="52" y="28" text-anchor="middle" fill="#60a5fa">CURSOR ✓</text>
    </g>
  </g>
  <!-- title -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="440" y="130" font-size="64" font-weight="800" fill="#f8fafc">memory-passport</text>
    <text x="442" y="178" font-size="24" fill="#c4b5fd">Your AI memory. Yours to take anywhere.</text>
    <text x="442" y="222" font-size="17" fill="#94a3b8">One plain-text format any assistant can export to and import from.</text>
    <g transform="translate(442 246)" font-family="Menlo,Consolas,monospace" font-size="15">
      <rect x="0" y="0" width="300" height="34" rx="8" fill="#0b1020" stroke="#312e81"/>
      <text x="14" y="23" fill="#a5b4fc">$ pip install memory-passport</text>
    </g>
  </g>
</svg>
